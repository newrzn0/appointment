{% extends "base.html" %}

{% block title %}Book Appointment - {{ business.name }}{% endblock %}

{% block content %}
<div class="booking-container">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">{{ business.name }}</h2>
            <small>{{ business.address }}</small>
        </div>
        <div class="card-body">
            <h4 class="mb-4">Book Your Appointment</h4>
            
            <form method="POST" action="{{ url_for('book_appointment', business_id=business.id) }}">
                <div class="mb-3">
                    <label for="date" class="form-label">Select Date</label>
                    <input type="date" class="form-control" id="date" name="date" 
                           value="{{ selected_date.strftime('%Y-%m-%d') }}"
                           min="{{ today.strftime('%Y-%m-%d') }}" 
                           max="{{ max_date.strftime('%Y-%m-%d') }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Available Time Slots</label>
                    <div class="row" id="time-slots">
                        {% for slot in time_slots %}
                        <div class="col-md-3 mb-2">
                            <div class="time-slot p-2 text-center border rounded {% if slot.is_booked %}booked{% endif %}"
                                 data-time="{{ slot.time }}">
                                {{ slot.time }}
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <input type="hidden" name="time_slot" id="selected-time" required>
                
                <div class="mb-3">
                    <label for="name" class="form-label">Your Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" name="phone" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Book Appointment</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const timeSlots = document.querySelectorAll('.time-slot:not(.booked)');
    const selectedTimeInput = document.getElementById('selected-time');
    const dateInput = document.getElementById('date');
    
    timeSlots.forEach(slot => {
        slot.addEventListener('click', function() {
            // Remove selected class from all slots
            timeSlots.forEach(s => s.classList.remove('bg-primary', 'text-white'));
            
            // Add selected class to clicked slot
            this.classList.add('bg-primary', 'text-white');
            
            // Update hidden input
            selectedTimeInput.value = this.dataset.time;
        });
    });

    // Handle date change
    dateInput.addEventListener('change', function() {
        const selectedDate = this.value;
        const businessId = {{ business.id }};
        
        // Fetch new time slots for the selected date
        fetch(`/api/time-slots/${businessId}?date=${selectedDate}`)
            .then(response => response.json())
            .then(slots => {
                const timeSlotsContainer = document.getElementById('time-slots');
                timeSlotsContainer.innerHTML = '';
                
                slots.forEach(slot => {
                    const col = document.createElement('div');
                    col.className = 'col-md-3 mb-2';
                    
                    const timeSlot = document.createElement('div');
                    timeSlot.className = `time-slot p-2 text-center border rounded ${slot.is_booked ? 'booked' : ''}`;
                    timeSlot.dataset.time = slot.time;
                    timeSlot.textContent = slot.time;
                    
                    if (!slot.is_booked) {
                        timeSlot.addEventListener('click', function() {
                            timeSlots.forEach(s => s.classList.remove('bg-primary', 'text-white'));
                            this.classList.add('bg-primary', 'text-white');
                            selectedTimeInput.value = this.dataset.time;
                        });
                    }
                    
                    col.appendChild(timeSlot);
                    timeSlotsContainer.appendChild(col);
                });
            })
            .catch(error => console.error('Error fetching time slots:', error));
    });
});
</script>
{% endblock %}
